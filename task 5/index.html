<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=Number(prompt("Enter your age."));
        if(a>0 && Number.isFinite(a)&&Number.isInteger(a)){
        if(a>=18)alert("You are "+a+". Your are eligible to vote");
        else alert("You are not eligible to vote");
        document.write("<h3>Your Age: "+a+"</h3>");
        if(a>=18)document.write("You are eligible to vote!");
        else document.write("You are not eligible to vote!");
        }
        else alert("Enter a valid age!");
    </script>
</body>
</html>
